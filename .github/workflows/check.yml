name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finished files match the build
        run: ./build.sh --check
      - name: Build tests
        run: sh tests/build.test.sh
      - name: Skill content tests
        run: sh tests/skills.test.sh
      - name: Standard and conformance tests
        run: sh tests/standard.test.sh
      - name: Agent scenario tests
        run: sh tests/agents.test.sh
